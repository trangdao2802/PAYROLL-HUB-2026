name: Apply HOLD cancel carryover fix

on:
  push:
    branches:
      - fix/hold-cancel-carryover-dedup

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hold-cancel-carryover-dedup
      - name: Patch HOLD reconciliation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/lib/utils/hold-carryover.ts')
          text = path.read_text()

          old = '''export function collapseMergedHoldSourceRows({
            rows,
            mergedRow,
            canonicalIndex,
            updatedRow,
          }: {
            rows: HoldCarryRow[];
            mergedRow: HoldCarryRow;
            canonicalIndex: number;
            updatedRow: HoldCarryRow;
          }): HoldCarryRow[] {
            const mergedIndexes = getMergedHoldOriginalIndexes(mergedRow).filter(
              (index) => index < rows.length,
            );
            if (mergedIndexes.length <= 1) {
              const nextRows = [...rows];
              nextRows[canonicalIndex] = updatedRow;
              return nextRows;
            }

            const indexesToRemove = new Set(
              mergedIndexes.filter((index) => index !== canonicalIndex),
            );

            return rows
              .map((row, index) => (index === canonicalIndex ? updatedRow : row))
              .filter((_row, index) => !indexesToRemove.has(index));
          }
          '''
          new = '''export function collapseMergedHoldSourceRows({
            rows,
            mergedRow,
            canonicalIndex,
            updatedRow,
          }: {
            rows: HoldCarryRow[];
            mergedRow: HoldCarryRow;
            canonicalIndex: number;
            updatedRow: HoldCarryRow;
          }): HoldCarryRow[] {
            const mergedIndexes = getMergedHoldOriginalIndexes(mergedRow).filter(
              (index) => index < rows.length,
            );

            // Legacy/carried rows do not always retain _originalIndex. Fall back to the
            // report-scoped semantic identity so changing one displayed merged HOLD to
            // CANCEL/ADD physically removes every hidden duplicate from storage.
            const scopedIdentity = getHoldScopedIdentity(mergedRow);
            const semanticDuplicateIndexes = scopedIdentity
              ? rows
                  .map((sourceRow, index) =>
                    sourceRow && getHoldScopedIdentity(sourceRow) === scopedIdentity
                      ? index
                      : -1,
                  )
                  .filter((index) => index >= 0)
              : [];
            const representedIndexes = Array.from(
              new Set([...mergedIndexes, ...semanticDuplicateIndexes, canonicalIndex]),
            ).filter((index) => index >= 0 && index < rows.length);

            const indexesToRemove = new Set(
              representedIndexes.filter((index) => index !== canonicalIndex),
            );

            return rows
              .map((row, index) => (index === canonicalIndex ? updatedRow : row))
              .filter((_row, index) => !indexesToRemove.has(index));
          }
          '''
          if old not in text:
              raise SystemExit('collapseMergedHoldSourceRows block not found')
          text = text.replace(old, new)

          old = '''export function getHoldSemanticIdentity(row: HoldCarryRow): string {
            const arisingMonth = getArisingMonth(row);
            if (!arisingMonth) return "";

            return [
              arisingMonth.dot,
              firstPresent(row, ["ID Number", "ID NUMBER", "ID", "Mã AE"]),
              firstPresent(row, ["Full name", "FULL NAME", "Full Name", "Beneficiary Name"]),
              firstPresent(row, ["L07", "Mã ae", "Mã AE"]),
              firstPresent(row, ["BU", "Business"]),
              firstPresent(row, ["Bank Account Number", "BANK ACCOUNT NUMBER", "STK AE"]),
              Math.abs(
                parseMoneyToNumber(
                  firstPresent(row, ["TOTAL PAYMENT", "Total Payment", "Payment Amount"]),
                ),
              ),
              firstPresent(row, ["Sheet Source", "SHEET SOURCE"]),
              "HOLD",
            ]
              .map(normalizedPart)
              .join("|");
          }
          '''
          new = '''export function getHoldSemanticIdentity(row: HoldCarryRow): string {
            const arisingMonth = getArisingMonth(row);
            if (!arisingMonth) return "";

            // A carried HOLD and the same HOLD re-imported from a later workbook are
            // one business transaction even when enrichment/source labels differ.
            const idNumber = firstPresent(row, ["ID Number", "ID NUMBER", "ID", "Mã AE"]);
            const bankAccount = firstPresent(row, [
              "Bank Account Number",
              "BANK ACCOUNT NUMBER",
              "STK AE",
            ]);
            const fullName = firstPresent(row, [
              "Full name",
              "FULL NAME",
              "Full Name",
              "Beneficiary Name",
            ]);
            const l07 = firstPresent(row, ["L07", "Mã ae", "Mã AE"]);
            const employeeIdentity = cleanText(idNumber)
              ? `ID:${normalizedPart(idNumber)}`
              : cleanText(bankAccount)
                ? `BANK:${normalizedPart(bankAccount)}`
                : `NAME:${normalizedPart(fullName)}|L07:${normalizedPart(l07)}`;
            const amount = Math.abs(
              parseMoneyToNumber(
                firstPresent(row, ["TOTAL PAYMENT", "Total Payment", "Payment Amount"]),
              ),
            );

            return [arisingMonth.dot, employeeIdentity, bankAccount, amount, "HOLD"]
              .map(normalizedPart)
              .join("|");
          }
          '''
          if old not in text:
              raise SystemExit('getHoldSemanticIdentity block not found')
          text = text.replace(old, new)
          path.write_text(text)

          test_path = Path('tests/hold-carryover.test.ts')
          tests = test_path.read_text()
          marker = 'test("does not merge transactions when an exact identity field differs", () => {'
          if 'merges the same HOLD even when carried and workbook source labels differ' not in tests:
              tests += '''

          test("merges the same HOLD even when carried and workbook source labels differ", () => {
            const carried = row("02.2026", "Hold", {
              id: "carry",
              _holdCarryKey: "carry",
              _originalIndex: 0,
              "Sheet Source": "Hold T1",
              BU: "AHN",
              L07: "HN0001.TEST",
            });
            const imported = row("02.2026", "Hold", {
              id: "source",
              _originalIndex: 1,
              "Sheet Source": "HOLD",
              BU: "AHN-ENRICHED",
              L07: "HN0001.UPDATED",
            });

            const merged = mergeDuplicateHoldRows([carried, imported]);
            assert.equal(merged.length, 1);
            assert.deepEqual(getMergedHoldOriginalIndexes(merged[0]), [0, 1]);
          });

          test("operation change collapses semantic duplicates even without original indexes", () => {
            const carried = row("02.2026", "Hold", { id: "carry", _holdCarryKey: "carry" });
            const imported = row("02.2026", "Hold", { id: "source" });
            const merged = mergeDuplicateHoldRows([carried, imported]);

            const collapsed = collapseMergedHoldSourceRows({
              rows: [carried, imported],
              mergedRow: merged[0],
              canonicalIndex: 1,
              updatedRow: { ...imported, "Nghiệp vụ": "Cancel" },
            });

            assert.equal(collapsed.length, 1);
            assert.equal(collapsed[0]["Nghiệp vụ"], "Cancel");
          });

          test("a resolved HOLD suppresses a later workbook copy despite source metadata changes", () => {
            const februaryCancel = row("02.2026", "Cancel", {
              id: "feb-cancel",
              _holdStatusBeforeSave: "Hold",
              "Sheet Source": "Hold T1",
              BU: "AHN",
              L07: "HN0001.TEST",
            });
            const marchWorkbookHold = row("03.2026", "Hold", {
              id: "mar-source",
              "Sheet Source": "HOLD",
              BU: "AHN-ENRICHED",
              L07: "HN0001.UPDATED",
            });

            const reconciled = reconcileHoldTransactionRows([
              februaryCancel,
              marchWorkbookHold,
            ]);

            assert.deepEqual(
              reconciled.map((item) => [item["Tháng báo cáo"], item["Nghiệp vụ"]]),
              [["02.2026", "Cancel"]],
            );
          });
          '''
          test_path.write_text(tests)
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/lib/utils/hold-carryover.ts tests/hold-carryover.test.ts
          git commit -m "fix: keep cancelled HOLD from carrying forward"
          git push origin HEAD:fix/hold-cancel-carryover-dedup
